<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日英同時位置検索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>日英同時位置検索</h1>
      <p class="sub">同じ意味の日本語と英語に対して、先頭/末尾から指定の位置に指定の文字が来るペアを検索します。</p>

      <section class="panel">
        <h2>検索条件</h2>
        <div id="inputError" class="input-error" aria-live="polite"></div>
        <div class="grid2">
          <fieldset>
            <legend>日本語</legend>
            <div class="row cond-line">
              <select id="bDir"><option value="start">先頭から</option><option value="end">末尾から</option></select>
              <input id="bPos" type="number" min="1" value="1" />
              <span>文字目が</span>
              <input id="bChar" type="text" placeholder="ひらがなを入力" />
            </div>
          </fieldset>
          <fieldset>
            <legend>英語</legend>
            <div class="row cond-line">
              <select id="aDir"><option value="start">先頭から</option><option value="end">末尾から</option></select>
              <input id="aPos" type="number" min="1" value="1" />
              <span>文字目が</span>
              <input id="aChar" type="text" placeholder="アルファベットを入力" />
            </div>
          </fieldset>
        </div>
        <div class="row search-row">
          <button id="searchBtn" type="button" class="search">検索</button>
        </div>
      </section>

      <section class="panel">
        <h2>結果</h2>
        <div id="summary">まだ検索していません</div>
        <div id="results"></div>
      </section>
    </main>

    <script src="sheet-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
