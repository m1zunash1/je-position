<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同時位置検索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>同時位置検索</h1>
      <p class="sub">日本語・英語・カタカナ英語（英語読み）から2つを選び、同じ意味の単語を文字の位置で検索します。</p>

      <section class="panel">
        <h2>検索条件</h2>
        <div id="inputError" class="input-error" aria-live="polite"></div>
        <div class="grid2">
          <fieldset class="condition-card">
            <legend>条件 1</legend>
            <label class="language-label" for="leftLang">言語</label>
            <select id="leftLang" class="language-select">
              <option value="ja" selected>日本語</option>
              <option value="en">英語</option>
              <option value="reading">カタカナ英語（英語読み）</option>
            </select>
            <div class="row cond-line">
              <select id="leftDir" aria-label="条件1の方向"><option value="start">先頭から</option><option value="end">末尾から</option></select>
              <input id="leftPos" aria-label="条件1の文字位置" type="number" min="1" value="1" />
              <span>文字目が</span>
              <input id="leftChar" type="text" inputmode="text" maxlength="2" placeholder="ひらがな1文字" />
            </div>
          </fieldset>
          <fieldset class="condition-card">
            <legend>条件 2</legend>
            <label class="language-label" for="rightLang">言語</label>
            <select id="rightLang" class="language-select">
              <option value="ja">日本語</option>
              <option value="en" selected>英語</option>
              <option value="reading">カタカナ英語（英語読み）</option>
            </select>
            <div class="row cond-line">
              <select id="rightDir" aria-label="条件2の方向"><option value="start">先頭から</option><option value="end">末尾から</option></select>
              <input id="rightPos" aria-label="条件2の文字位置" type="number" min="1" value="1" />
              <span>文字目が</span>
              <input id="rightChar" type="text" inputmode="text" maxlength="2" placeholder="アルファベット1文字" />
            </div>
          </fieldset>
        </div>
        <div class="row search-row">
          <button id="searchBtn" type="button" class="search">検索</button>
        </div>
      </section>

      <section class="panel">
        <h2>結果</h2>
        <div id="summary">まだ検索していません</div>
        <div id="results"></div>
      </section>
    </main>

    <script src="sheet-data.js"></script>
    <script src="app.js?v=0d8a7c6"></script>
  </body>
</html>
